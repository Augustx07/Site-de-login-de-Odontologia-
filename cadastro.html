<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro Acessível</title>

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="container">

<h1>Cadastro</h1>

<form>

<label for="nome">
Nome Completo
</label>

<input
type="text"
id="nome"
required
>

<label for="cadEmail">
Email
</label>

<input
type="email"
id="cadEmail"
required
>

<label for="cadSenha">
Senha
</label>

<input
type="password"
id="cadSenha"
required
>

<button type="submit">
Cadastrar
</button>

</form>

<a href="index.html">
Voltar para Login
</a>

</main>

<script src="js/voice.js"></script>

</body>
</html>
