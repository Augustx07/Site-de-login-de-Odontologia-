<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login Acessível</title>

<link rel="stylesheet" href="estilo.css">
</head>
<body>

<main class="container">

<h1>Entrar</h1>

<form aria-label="Formulário de Login">

<label for="email">
Email
</label>

<input
type="email"
id="email"
name="email"
required
aria-required="true"
>

<label for="senha">
Senha
</label>

<input
type="password"
id="senha"
name="senha"
required
aria-required="true"
>

<button type="submit">
Entrar
</button>

<p>
Não possui conta?
<a href="cadastro.html">
Cadastre-se
</a>
</p>

</form>

<button id="voiceBtn">
🎤 Ativar Assistente de Voz
</button>

<div
id="status"
aria-live="polite">
</div>

</main>

<script src="js/voice.js"></script>

</body>
</html>
